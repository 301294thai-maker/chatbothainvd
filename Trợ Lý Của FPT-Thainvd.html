.app{max-width:780px;height:calc(100% - 24px);margin:12px auto;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);box-shadow:0 12px 40px rgba(120,40,0,.35);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
header,form#f{background:var(--g);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
header{padding:12px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--br)}
header b{font-size:16px;color:var(--or)}header span{color:var(--mut);font-size:12px}
.sp{flex:1}
.logo{height:38px;width:auto;flex:none}
.lead label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}.lead input{width:100%;border:1px solid var(--br);border-radius:12px;padding:9px 12px;background:rgba(255,255,255,.9);font:inherit;color:var(--tx)}
.send{margin-top:12px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border:0;border-radius:14px;padding:9px 18px}
a.tel,.call a{color:var(--or);font-weight:700;text-decoration:none}
.call{margin-top:10px;padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(242,106,33,.16),rgba(255,154,77,.16));border:1px solid var(--br);text-align:center}
button{font:inherit;cursor:pointer}
.ghost{background:var(--g2);border:1px solid var(--br);color:var(--or);border-radius:12px;padding:6px 12px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--g);border:1px solid var(--br);box-shadow:0 4px 16px rgba(120,40,0,.15);white-space:pre-wrap}
.m.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-color:transparent}
.m.wide{max-width:100%;width:100%;white-space:normal;border-radius:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--g);color:var(--or);border:1px solid var(--or);border-radius:20px;padding:7px 15px;transition:.15s}
.opts button:hover{background:var(--or);color:#fff}
.scroll{overflow-x:auto;border:1px solid var(--br);border-radius:14px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:420px}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--br);border-right:1px solid var(--br)}
tr:last-child>*{border-bottom:0}th:last-child,td:last-child{border-right:0}
th{background:rgba(242,106,33,.16);color:#8f3a0a}
td{background:rgba(255,255,255,.6)}
.warn{color:var(--mut);font-size:13px;margin-top:8px;padding:8px 10px;border-radius:12px;background:rgba(242,106,33,.08)}
form#f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--br)}
#in{flex:1;border:1px solid var(--br);border-radius:16px;padding:10px 14px;background:rgba(255,255,255,.9);color:var(--tx);font:inherit}
#in:focus{outline:2px solid var(--or2);border-color:var(--or)}
#go{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border:0;border-radius:16px;padding:0 20px}
@media(max-width:560px){.app{height:calc(100% - 12px);margin:6px;border-radius:20px}}
</style>
</head>

return null}
